<!DOCTYPE html>
<html>
  <head>
    <title>Partitura Interactiva - MindAR</title>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
    
    <script>
      AFRAME.registerComponent('reproducir-nota', {
        init: function () {
          let el = this.el; // El plano que tocamos
          let audio = document.querySelector("#audio-sol");
          
          el.addEventListener('click', function () {
            // 1. FEEDBACK VISUAL: Parpadea en rojo para confirmar que el toque funciona
            let colorOriginal = el.getAttribute('color');
            el.setAttribute('color', '#EF2D5E');
            setTimeout(() => el.setAttribute('color', colorOriginal), 200);

            // 2. REPRODUCIR AUDIO
            if (audio) {
              audio.currentTime = 0; 
              audio.play().then(() => {
                console.log("Audio reproduciendo correctamente");
              }).catch(function(error) {
                console.error("El navegador bloqueó el audio:", error);
              });
            }
          });
        }
      });
    </script>
  </head>
  <body style="margin: 0; overflow: hidden;">
    
    <a-scene 
      mindar-image="imageTargetSrc: ./marcador-partitura.mind; autoStart: true;" 
      color-space="sRGB" 
      renderer="colorManagement: true, physicallyCorrectLights" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <audio id="audio-sol" src="./sonido-sol.mp3" preload="auto"></audio>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false" cursor="fuse: false; rayOrigin: mouse;" raycaster="objects: .interactivo"></a-camera>

      <a-entity mindar-image-target="targetIndex: 0">
        
        <!-- Agrupador sin interactividad -->
        <a-entity position="0 0 0">
          
          <!-- EL PLANO: Aquí debe ir la clase y el componente porque es la geometría física -->
          <a-plane 
            class="interactivo" 
            reproducir-nota
            color="#222" opacity="0.8" width="1.5" height="0.6" position="0 0 0">
          </a-plane>
          
          <!-- El texto no es tocable, solo visual -->
          <a-text 
            value="Nota: SOL" 
            align="center" 
            color="#FFC107" 
            scale="1.5 1.5 1.5"
            position="0 0 0.01">
          </a-text>
          
        </a-entity>
        
      </a-entity>
      
    </a-scene>
  </body>
</html>
