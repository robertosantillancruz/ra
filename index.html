<!DOCTYPE html>
<html>
  <head>
    <title>Partitura Interactiva - MindAR</title>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <!-- Importamos la librería específica de MindAR para Image Tracking -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
  </head>
  <body style="margin: 0; overflow: hidden;">
    
    <!-- 1. Configuramos la escena de MindAR y cargamos el archivo .mind -->
    <a-scene 
      mindar-image="imageTargetSrc: marcador-partitura.mind; autoStart: true;" 
      color-space="sRGB" 
      renderer="colorManagement: true, physicallyCorrectLights" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <audio id="audio-sol" src="sonido-sol.mp3" preload="auto"></audio>
      </a-assets>

      <!-- 2. La cámara ahora lleva el cursor para detectar los toques en la pantalla -->
      <a-camera position="0 0 0" look-controls="enabled: false" cursor="fuse: false; rayOrigin: mouse;" raycaster="objects: .interactivo"></a-camera>

      <!-- 3. targetIndex: 0 se refiere a la primera imagen dentro de tu archivo .mind -->
      <a-entity mindar-image-target="targetIndex: 0">
        
        <a-entity 
          class="interactivo" 
          sound="src: #audio-sol; on: click; poolSize: 2"
          position="0 0 0">
          
          <a-plane color="#222" opacity="0.8" width="1.5" height="0.6" position="0 0 0"></a-plane>
          
          <a-text 
            value="Nota: SOL" 
            align="center" 
            color="#FFC107" 
            scale="1.5 1.5 1.5"
            position="0 0 0.01">
          </a-text>
          
        </a-entity>
        
      </a-entity>
      
    </a-scene>
  </body>
</html>
