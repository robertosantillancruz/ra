<!DOCTYPE html>
<html>
  <head>
    <title>Partitura Interactiva - MindAR</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
    
    <style>
      /* Estilos para nuestra pantalla de inicio */
      body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; font-family: sans-serif; }
      
      #pantalla-inicio {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        background-color: #2b2b2b;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 9999; /* Por encima de la cámara */
      }

      h1 { color: white; text-align: center; margin-bottom: 30px; }

      #btn-empezar {
        padding: 15px 40px;
        font-size: 20px;
        background-color: #FFC107;
        color: #000;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-weight: bold;
        box-shadow: 0 4px 6px rgba(0,0,0,0.3);
      }
      
      #btn-empezar:active { background-color: #e0a800; transform: translateY(2px); }
    </style>

    <script>
      // Componente para manejar la lógica cuando se detecta la partitura
      AFRAME.registerComponent('controlador-partitura', {
        init: function () {
          let audio = document.querySelector("#audio-sol");
          let el = this.el; // El marcador (mindar-image-target)

          // Evento: Cuando la cámara encuentra la partitura
          el.addEventListener("targetFound", event => {
            console.log("¡Partitura detectada!");
            // Reproducimos el sonido automáticamente al encontrarla
            if(audio){
                audio.currentTime = 0;
                audio.play().catch(e => console.log("Error de audio:", e));
            }
          });

          // Evento: Cuando la cámara pierde la partitura
          el.addEventListener("targetLost", event => {
            console.log("Partitura perdida.");
            // Opcional: Pausar el sonido si quitan la cámara
            // if(audio) audio.pause();
          });
        }
      });

      // Lógica de la pantalla de inicio (fuera de A-Frame)
      document.addEventListener("DOMContentLoaded", function() {
        let btnEmpezar = document.getElementById("btn-empezar");
        let pantallaInicio = document.getElementById("pantalla-inicio");
        let scene = document.querySelector("a-scene");
        let audio = document.querySelector("#audio-sol");

        // Pausamos el motor de RA hasta que presionen el botón
        scene.setAttribute("mindar-image", "autoStart: false");

        btnEmpezar.addEventListener("click", function() {
          console.log("Botón empezar presionado");
          
          // 1. Truco maestro: Reproducir y pausar el audio al instante con el clic del usuario 
          // Esto "desbloquea" el audio en iPhones y Androids.
          audio.play().then(() => {
              audio.pause();
              audio.currentTime = 0;
          }).catch(e => console.log("Desbloqueo silencioso falló:", e));

          // 2. Ocultar pantalla de inicio
          pantallaInicio.style.display = "none";

          // 3. Arrancar el motor de RA y la cámara
          scene.systems["mindar-image-system"].start();
        });
      });
    </script>
  </head>
  <body>
    
    <!-- PANTALLA DE INICIO (HTML Normal) -->
    <div id="pantalla-inicio">
      <h1>Partitura Interactiva</h1>
      <button id="btn-empezar">Empezar Experiencia</button>
    </div>

    <!-- ESCENA 3D (Oculta hasta dar clic) -->
    <a-scene 
      mindar-image="imageTargetSrc: ./marcador-partitura.mind;" 
      color-space="sRGB" 
      renderer="colorManagement: true, physicallyCorrectLights" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <audio id="audio-sol" src="./sonido-sol.mp3" preload="auto"></audio>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- Aquí asignamos nuestro controlador. targetIndex: 0 -->
      <a-entity mindar-image-target="targetIndex: 0" controlador-partitura>
        
        <!-- Elemento visual que aparece sobre el papel -->
        <a-entity position="0 0 0">
          <a-plane color="#222" opacity="0.8" width="1.5" height="0.6" position="0 0 0"></a-plane>
          <a-text 
            value="Nota: SOL" 
            align="center" 
            color="#FFC107" 
            scale="1.5 1.5 1.5"
            position="0 0 0.01">
          </a-text>
        </a-entity>
        
      </a-entity>
      
    </a-scene>
  </body>
</html>
