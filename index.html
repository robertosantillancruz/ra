<!DOCTYPE html>
<html>
  <head>
    <title>Partitura Interactiva - MindAR</title>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
    
    <!-- 1. NUESTRO SCRIPT A PRUEBA DE FALLOS PARA EL AUDIO -->
    <script>
      AFRAME.registerComponent('reproducir-nota', {
        init: function () {
          // Buscamos el archivo de audio original en el HTML
          let audio = document.querySelector("#sonido-sol");
          
          // Escuchamos cuando el alumno toque la nota
          this.el.addEventListener('click', function () {
            // Reiniciamos el audio por si lo tocan varias veces rápido
            audio.currentTime = 0; 
            // Forzamos la reproducción
            audio.play().catch(function(error) {
              console.log("El navegador bloqueó el audio:", error);
            });
          });
        }
      });
    </script>
  </head>
  <body style="margin: 0; overflow: hidden;">
    
    <a-scene 
      mindar-image="imageTargetSrc: ./marcador-partitura.mind; autoStart: true;" 
      color-space="sRGB" 
      renderer="colorManagement: true, physicallyCorrectLights" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <!-- Asegúrate de que el nombre coincida exactamente con tu mp3 -->
        <audio id="audio-sol" src=" ./sonido-sol.mp3" preload="auto"></audio>
      </a-assets>

      <!-- Cámara con el cursor activado -->
      <a-camera position="0 0 0" look-controls="enabled: false" cursor="fuse: false; rayOrigin: mouse;" raycaster="objects: .interactivo"></a-camera>

      <a-entity mindar-image-target="targetIndex: 0">
        
        <!-- 2. AGREGAMOS NUESTRO COMPONENTE 'reproducir-nota' AQUÍ -->
        <a-entity 
          class="interactivo" 
          reproducir-nota
          position="0 0 0">
          
          <a-plane color="#222" opacity="0.8" width="1.5" height="0.6" position="0 0 0"></a-plane>
          
          <a-text 
            value="Nota: SOL" 
            align="center" 
            color="#FFC107" 
            scale="1.5 1.5 1.5"
            position="0 0 0.01">
          </a-text>
          
        </a-entity>
        
      </a-entity>
      
    </a-scene>
  </body>
</html>
