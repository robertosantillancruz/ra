<!DOCTYPE html>
<html>
  <head>
    <title>Mi Primera Escena RA</title>
    <!-- 1. Importar el framework A-Frame -->
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <!-- 2. Importar la librería AR.js para habilitar la cámara y el tracking -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  </head>
  <!-- Quitar los márgenes para que la cámara ocupe toda la pantalla -->
  <body style="margin: 0; overflow: hidden;">

    <!-- 3. Configurar la escena indicando que usará AR.js -->
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">

      <!-- 4. Definir el disparador (Marcador Hiro) -->
      <a-marker preset="hiro">
        <!-- 5. El objeto 3D que aparecerá sobre el marcador -->
        <a-box position="0 0.5 0" color="#4CC3D9" animation="property: rotation; to: 0 360 0; loop: true; dur: 3000"></a-box>
      </a-marker>

      <!-- 6. Cámara virtual del usuario -->
      <a-entity camera></a-entity>

    </a-scene>
  </body>
</html>
